<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>1688 采集到 OPS</title><link rel="stylesheet" href="popup.css">
<body><header><small>MAINAPIS · OPS</small><h1>采集当前商品</h1><p>在 1688 商品详情页打开，预览后保存到待整理采集箱。</p></header>
<div class="actions"><button id="collect">读取当前商品</button><button id="open" class="secondary">打开 OPS</button></div>
<p id="status" role="status">等待采集</p>
<section id="preview" hidden><h2 id="title"></h2><p id="counts"></p><div id="skuPreview"></div><ul id="warnings"></ul><label>商品资料预览 <small>可修改 JSON 后再导入</small><textarea id="json" rows="12" spellcheck="false"></textarea></label><button id="send">确认导入 OPS 待整理采集箱</button><button id="download" class="secondary">下载 JSON 备用</button></section>
<details><summary>修复已发布商品 554 的 SKU 配图</summary><p>在 CRMEB 商品 554 编辑页使用。仅填图片，不自动保存；核对后用商城原来的保存按钮提交。</p><label>选择最新采集 JSON<input id="merchantImagesFile" type="file" accept=".json,application/json"></label><button id="fillMerchant" class="secondary">填入商品 554 配图（不提交）</button></details><p><button id="diagnose" class="secondary">页面结构诊断</button></p><section id="diagnostics" hidden><label>诊断结果 <small>仅含字段名和节点类型，不含账号、Cookie 或字段值</small><textarea id="diagnosticText" rows="8" readonly></textarea></label><button id="downloadDiagnostic" class="secondary">下载诊断 JSON</button></section>
<footer>试用版 0.1.5 · 图片保留原链接。不会发布商品或读取你的 1688 密码。</footer><script type="module" src="popup.js"></script></body></html>
