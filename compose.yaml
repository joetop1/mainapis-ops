services:
  goods-ops:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - goods_ops_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  goods_ops_data:
